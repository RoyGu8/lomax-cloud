services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lomax-backend:1.0
    container_name: lomax-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=7001
      - DB_NAME=lomax
      - DB_USER=admin
      - DB_PASSWORD=LomaxDB2026!
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_TABLE=producto_atributos
      - ORIGINAL_BUCKET=lomax-originales
      - THUMBNAIL_BUCKET=lomax-miniaturas
      - LAMBDA_FUNCTION=lomax-image-processor
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lomax-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lomax-frontend:1.0
    container_name: lomax-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - lomax-network

networks:
  lomax-network:
    name: lomax-network
    driver: bridge
apiVersion: v1
kind: ConfigMap
metadata:
  name: lomax-nginx-config
  labels:
    app: lomax
    tier: frontend
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://lomax-backend-service:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lomax-frontend
  labels:
    app: lomax
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lomax
      tier: frontend
  template:
    metadata:
      labels:
        app: lomax
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: localhost:5100/lomax-frontend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: nginx-conf
        configMap:
          name: lomax-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: lomax-frontend-service
  labels:
    app: lomax
    tier: frontend
spec:
  type: NodePort
  selector:
    app: lomax
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
